<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Noti5me{% endblock %}</title>
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .card { border-radius: 12px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="/">
        <i class="bi bi-bell-fill text-warning"></i> Noti5me
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="{% url 'whatsapp_messages:list' %}">
              <i class="bi bi-whatsapp text-success"></i> WhatsApp
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'mail_message:mail_list' %}">
              <i class="bi bi-envelope text-danger"></i> Email
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'yt_vidio_schedule:video_list' %}">
              <i class="bi bi-youtube text-danger"></i> YouTube
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center text-white gap-3">
          <span class="small text-secondary"><i class="bi bi-person-circle"></i> {{ request.user.username }}</span>
          <a href="{% url 'accounts:logout' %}" class="btn btn-sm btn-outline-secondary">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash Messages -->
  <div class="container" style="max-width: 900px;">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
